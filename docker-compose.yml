services:
  runner:
    build:
      context: ./src
      dockerfile: "maria-db/dockerfile"
    container_name: mariadb-sushi-toshi
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sushi_toshi_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: