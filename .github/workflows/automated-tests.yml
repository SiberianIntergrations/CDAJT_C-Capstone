name: Automated Tests

on:
  push:
    branches: [ main, develop, David--QR-code ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore src/back-end/back-end.csproj

    - name: Build
      run: dotnet build src/back-end/back-end.csproj --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test src/back-end.Tests/back-end.Tests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=unit-test-results.trx"

    - name: Run Integration Tests
      run: dotnet test src/back-end.IntegrationTests/back-end.IntegrationTests.csproj --configuration Release --verbosity minimal --logger "trx;LogFileName=integration-test-results.trx"

    - name: Generate Coverage Report
      run: dotnet test src/back-end.Tests/back-end.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: |
          **/*.trx
          ./coverage/**

    - name: Upload Coverage to Codecov
      if: success()
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/**/coverage.cobertura.xml
        flags: backend
        name: backend-coverage

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: src/front-end/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: src/front-end

    - name: Run Linter
      run: npm run lint
      working-directory: src/front-end
      continue-on-error: true

    - name: Run Unit Tests
      run: npm test -- --coverage --watchAll=false
      working-directory: src/front-end

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-test-results
        path: src/front-end/coverage

    - name: Upload Coverage to Codecov
      if: success()
      uses: codecov/codecov-action@v4
      with:
        files: ./src/front-end/coverage/lcov.info
        flags: frontend
        name: frontend-coverage

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: src/front-end/package-lock.json

    - name: Install Backend Dependencies
      run: dotnet restore src/back-end/back-end.csproj

    - name: Build Backend
      run: dotnet build src/back-end/back-end.csproj --no-restore --configuration Release

    - name: Start Backend
      run: |
        cd src/back-end
        dotnet run --no-build --configuration Release &
        sleep 15
      env:
        ASPNETCORE_URLS: http://localhost:5264

    - name: Install Frontend Dependencies
      run: npm ci
      working-directory: src/front-end

    - name: Build Frontend
      run: npm run build
      working-directory: src/front-end

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      working-directory: src/front-end

    - name: Run E2E Tests
      run: npm run test:e2e
      working-directory: src/front-end

    - name: Upload E2E Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: src/front-end/playwright-report
        retention-days: 30

  test-summary:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: always()

    steps:
    - name: Download Backend Test Results
      uses: actions/download-artifact@v4
      with:
        name: backend-test-results
        path: ./backend-results
      continue-on-error: true

    - name: Download Frontend Test Results
      uses: actions/download-artifact@v4
      with:
        name: frontend-test-results
        path: ./frontend-results
      continue-on-error: true

    - name: Test Summary
      run: |
        echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Backend Tests" >> $GITHUB_STEP_SUMMARY
        echo "Unit and Integration tests completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Frontend Tests" >> $GITHUB_STEP_SUMMARY
        echo "Component tests completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Check artifacts for detailed test results and coverage reports" >> $GITHUB_STEP_SUMMARY
